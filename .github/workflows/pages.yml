name: Publicar Estudio RPG
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
      - name: Preparar site e pacote ZIP
        run: |
          mkdir -p dist/assets
          cp index.html dist/index.html
          cp masculino.html dist/masculino.html
          cp assets/masculino-walk.png dist/assets/masculino-walk.png
          cp IMG-20261110-WA0036.jpg dist/IMG-20261110-WA0036.jpg
          cat > dist/LEIA-ME.txt <<'EOF'
          ESTUDIO RPG
          Site estatico para GitHub Pages.
          Inclui a previa animada do personagem masculino em masculino.html.
          O editor gera spritesheets PNG e pacotes ZIP localmente.
          EOF
          cd dist
          zip -r ../estudio-rpg-site.zip .
      - name: Guardar ZIP do site
        uses: actions/upload-artifact@v4
        with:
          name: estudio-rpg-site-zip
          path: estudio-rpg-site.zip
          if-no-files-found: error
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Enviar site para Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
